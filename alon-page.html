<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>תיאטרון המדבקות</title>
<!--
  10.10. Alon's side of the sticker theatre, built by alon.js. One character
  at a time, his answer goes to Itzik's monitor. Everything here is sealed:
  the key is in the link after the #, kept on this phone after the first open.
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 50% 0,#3a2350,#14101c 70%);color:#f6efe4;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
main{max-width:460px;margin:0 auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column}
h1{font-size:26px;margin:8px 0 2px;text-align:center}
.sub{opacity:.75;text-align:center;margin:0 0 14px;font-size:15px}
.curtain{position:fixed;inset:0;pointer-events:none;z-index:5}
.curtain i{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,#8e1b2b 0 18px,#a8253a 18px 36px);box-shadow:0 0 40px #000;transition:transform 1.1s cubic-bezier(.7,0,.3,1)}
.curtain i:first-child{right:0}.curtain i:last-child{left:0}
.open .curtain i:first-child{transform:translateX(102%)}.open .curtain i:last-child{transform:translateX(-102%)}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf5a,#ff7a59);transition:width .4s}
.cnt{font-size:13px;opacity:.7;margin:6px 0 10px;text-align:center}
.stage{position:relative;background:#f6efe4;color:#1d1620;border-radius:22px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.stage.in{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.stage.out{animation:fly .35s ease-in forwards}
@keyframes pop{from{transform:translateY(40px) scale(.85) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fly{to{transform:translateX(-120%) rotate(-12deg);opacity:0}}
.pic{width:72%;max-width:260px;aspect-ratio:1;object-fit:contain;display:block;margin:0 auto 6px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.num{font-weight:800;font-size:20px;text-align:center}
.meta{font-size:14px;opacity:.7;text-align:center;margin-bottom:10px}
textarea{width:100%;min-height:110px;border:2px solid #d9cdb8;border-radius:14px;padding:10px 12px;font:inherit;background:#fff;color:inherit;resize:vertical}
textarea:focus{outline:none;border-color:#ff7a59}
.hint{font-size:13px;opacity:.6;margin:4px 2px 0}
.row{display:flex;gap:8px;margin-top:12px}
button{border:0;border-radius:14px;padding:14px 10px;font:700 16px system-ui,-apple-system,Arial,sans-serif;cursor:pointer}
.go{flex:2;background:#ff7a59;color:#fff}
.skip{flex:1;background:#e9e0d1;color:#3b3140}
.go:active,.skip:active{transform:scale(.97)}
.big{width:100%;background:#ffcf5a;color:#2a1a10;font-size:18px;margin-top:16px}
.done{text-align:center;padding:30px 10px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:16px}
.grid button{padding:0;background:rgba(255,255,255,.08);border-radius:9px;aspect-ratio:1;overflow:hidden;position:relative}
.grid img{width:100%;height:100%;object-fit:contain}
.grid button.ok::after{content:"✓";position:absolute;top:1px;left:4px;color:#7ee2a8;font-size:13px}
.err{text-align:center;margin-top:40px;opacity:.85}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="curtain"><i></i><i></i></div>
<main id="app"><p class="err">פותח את הווילון...</p></main>
<script>
(function(){
var app=document.getElementById('app');
var K=null,M=null,URLS={},i=0;
var SAVED=JSON.parse(localStorage.getItem('stkAlonAns')||'{}');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),a=new Uint8Array(b.length);for(var j=0;j<b.length;j++)a[j]=b.charCodeAt(j);return a;}
function open(name){
 return fetch(name,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();}).then(function(buf){
  var a=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},K,a.slice(12));});
}
function pic(x){
 if(URLS[x.f])return Promise.resolve(URLS[x.f]);
 return open('i/'+x.f+'.bin').then(function(pt){return URLS[x.f]=URL.createObjectURL(new Blob([pt],{type:'image/webp'}));});
}
var raw=(location.hash||'').slice(1)||localStorage.getItem('stkAlonKey')||'';
if(!raw){app.innerHTML='<p class="err">הקישור הזה חסר. בקש מאיציק לשלוח אותו שוב.</p>';return;}
crypto.subtle.importKey('raw',b64(raw),'AES-GCM',false,['decrypt']).then(function(k){K=k;return open('m.bin');})
 .then(function(pt){
  M=JSON.parse(new TextDecoder().decode(pt));
  localStorage.setItem('stkAlonKey',raw);
  if(location.hash)history.replaceState(null,'',location.pathname);
  intro();
 },function(){app.innerHTML='<p class="err">הקישור לא נפתח. בקש מאיציק לשלוח אותו שוב.</p>';});
function left(){return M.list.filter(function(x){return !SAVED[x.n];}).length;}
function intro(){
 var d=M.list.length-left();
 app.innerHTML='<h1>🎭 תיאטרון המדבקות</h1><p class="sub">'+M.list.length+' דמויות שאתה ואיציק בניתם. איציק כבר סיפר מי הן. עכשיו תורך, בלי לראות מה הוא אמר. אחר כך מצליבים.</p>'
  +'<div class="stage in"><p style="margin:0 0 6px">על כל דמות: מי זו, איך היא נולדה, ומתי שולחים אותה. שורה אחת מספיקה. אפשר להקליט במיקרופון של המקלדת.</p>'
  +(d?'<p style="margin:0;opacity:.7">כבר ענית על '+d+'. ממשיכים מאיפה שעצרת.</p>':'')
  +'<button class="big" id="start">'+(d?'ממשיכים':'מרימים מסך')+'</button></div><div class="grid" id="grid"></div>';
 grid();
 document.getElementById('start').onclick=function(){i=next(0);show();};
 setTimeout(function(){document.body.classList.add('open');},250);
}
function grid(){
 var g=document.getElementById('grid');if(!g)return;
 g.innerHTML=M.list.map(function(x,j){return '<button class="'+(SAVED[x.n]?'ok':'')+'" data-j="'+j+'" aria-label="מדבקה '+x.n+'"><img alt=""></button>';}).join('');
 g.querySelectorAll('button').forEach(function(b){
  var x=M.list[+b.getAttribute('data-j')];
  pic(x).then(function(u){b.querySelector('img').src=u;},function(){});
  b.onclick=function(){i=+b.getAttribute('data-j');show();};
 });
}
function next(from){for(var j=0;j<M.list.length;j++){var t=(from+j)%M.list.length;if(!SAVED[M.list[t].n])return t;}return -1;}
function show(){
 if(i<0)return finale();
 var x=M.list[i],d=M.list.length-left();
 app.innerHTML='<div class="bar"><b style="width:'+Math.round(100*d/M.list.length)+'%"></b></div><div class="cnt">'+d+' מתוך '+M.list.length+'</div>'
  +'<div class="stage in" id="st"><img class="pic" alt=""><div class="num">מדבקה #'+x.n+'</div>'
  +'<div class="meta">נשלחה '+x.c+' פעמים מאז '+esc(x.first)+'. אתה '+x.a+', איציק '+x.i+'</div>'
  +'<textarea id="t" placeholder="מי זו? מה הסיפור שלה?">'+esc(SAVED[x.n]||'')+'</textarea>'
  +'<p class="hint">התשובה הולכת רק לאיציק.</p>'
  +'<div class="row"><button class="skip" id="sk">דלג</button><button class="go" id="go">שליחה והבאה</button></div></div>'
  +'<button class="big" id="all" style="background:rgba(255,255,255,.1);color:#f6efe4;font-size:15px">כל הדמויות</button>';
 pic(x).then(function(u){var im=app.querySelector('.pic');if(im)im.src=u;},function(){});
 if(i+1<M.list.length)pic(M.list[i+1]).catch(function(){});
 document.getElementById('all').onclick=intro;
 document.getElementById('sk').onclick=function(){away(function(){i=(i+1)%M.list.length;show();});};
 document.getElementById('go').onclick=function(){
  var t=document.getElementById('t').value.trim(),b=this;if(!t){document.getElementById('t').focus();return;}
  b.disabled=true;b.textContent='שולח...';
  sealMsg({s:M.sig,n:x.n,t:t}).then(function(body){return fetch('https://ntfy.sh/'+M.topic,{method:'POST',body:body});}).then(function(r){
   if(!r.ok)throw 0;SAVED[x.n]=t;localStorage.setItem('stkAlonAns',JSON.stringify(SAVED));confetti();
   away(function(){i=next(i+1);show();});
  }).catch(function(){b.disabled=false;b.textContent='לא נשלח, לנסות שוב';});
 };
}
// The answer leaves sealed with the same key, so the relay sees only noise.
function sealMsg(o){
 var iv=crypto.getRandomValues(new Uint8Array(12));
 return crypto.subtle.importKey('raw',b64(raw),'AES-GCM',false,['encrypt']).then(function(ek){
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},ek,new TextEncoder().encode(JSON.stringify(o)));
 }).then(function(ct){var a=new Uint8Array(12+ct.byteLength);a.set(iv);a.set(new Uint8Array(ct),12);var s='';for(var j=0;j<a.length;j++)s+=String.fromCharCode(a[j]);return 'a1:'+btoa(s);});
}
function away(cb){var s=document.getElementById('st');if(!s)return cb();s.className='stage out';setTimeout(cb,330);}
function confetti(){
 var c=['#ffcf5a','#ff7a59','#7ee2a8','#8fb8ff','#f6efe4'];
 for(var j=0;j<26;j++){var e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=c[j%c.length];e.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(e);setTimeout(function(n){n.remove();}.bind(null,e),1900);}
}
function finale(){
 confetti();setTimeout(confetti,500);
 app.innerHTML='<div class="stage in done"><div style="font-size:54px">👏</div><h1 style="color:#1d1620">ענית על כולן</h1><p>איציק מקבל את זה עכשיו ומצליב עם מה שהוא אמר.</p><button class="big" id="all">לתקן או להוסיף</button></div>';
 document.getElementById('all').onclick=intro;
}
})();
</script>
</body>
</html>
