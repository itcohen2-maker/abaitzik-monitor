<!DOCTYPE html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>לוגו חדש למוניטור</title>
<style>
 :root{color-scheme:light dark}
 body{margin:0;padding:22px 16px 60px;background:#f6f8fc;color:#1f2430;
  font:400 17px/1.55 Heebo,system-ui,sans-serif;max-width:680px;margin-inline:auto}
 h1{font:600 22px Heebo,sans-serif;margin:0 0 6px}
 p{margin:0 0 18px;color:#5f6b7f}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
 figure{margin:0;background:#fff;border:1px solid #e3e9f4;border-radius:18px;padding:14px;text-align:center}
 figure img{width:100%;height:auto;max-width:190px;border-radius:26px;display:block;margin:0 auto 10px}
 b{display:block;font:600 18px Heebo,sans-serif}
 small{color:#5f6b7f;display:block;margin-top:2px}
 .now{margin-top:26px}
 @media(prefers-color-scheme:dark){
  body{background:#11151c;color:#eef1f7}
  figure{background:#171d27;border-color:#252c39}
  p,small{color:#9aa5b8}
 }
</style>
<h1>לוגו חדש למוניטור</h1>
<p>ארבע אפשרויות, כולן באותו ירוק של הדף. תגיד לי בצ׳אט את השם שמתחת למה שבחרת ואני מחליף את האייקון במסך הבית. עד שתבחר, שום דבר לא משתנה אצלך.</p>
<div class="grid">
 <figure><img src="options/pulse.png" alt="פעימה"><b>פעימה</b><small>הקו חי</small></figure>
 <figure><img src="options/bubble.png" alt="בועה"><b>בועה</b><small>שיחה שמחכה לך</small></figure>
 <figure><img src="options/bars.png" alt="עמודות"><b>עמודות</b><small>משהו נמדד ועולה</small></figure>
 <figure><img src="options/ring.png" alt="טבעת"><b>טבעת</b><small>מה שיש היום, מצויר חלק</small></figure>
</div>
<p class="now">האייקון שמותקן אצלך עכשיו הוא הטבעת, בגרסה הישנה עם קצוות משוננים. גם אם תשאיר טבעת, כדאי להחליף לגרסה החלקה.</p>
</html>
