<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>נר · סגנונות לאינסטגרם</title>
<meta name="theme-color" content="#0F1A3A">
<style>
  :root{--ink:#F2F5FA;--dim:rgba(242,245,250,.66);--line:rgba(255,255,255,.14);--glow:#F5A623}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:linear-gradient(180deg,#0F1A3A 0%,#0B1330 58%,#070B1A 100%);background-attachment:fixed;color:var(--ink);
    font-family:Heebo,"Segoe UI",system-ui,sans-serif;font-weight:300;line-height:1.55;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 110px)}
  header{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 0 6px;text-align:center}
  h1{font-size:26px;font-weight:500;margin:0 0 4px}
  .lede{color:var(--dim);font-size:15px;margin:0 0 14px}
  .bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 12px}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:999px;padding:7px 16px;font:inherit;font-size:15px;cursor:pointer}
  .chip.on{background:var(--glow);color:#1b1305;border-color:var(--glow);font-weight:500}
  h2{max-width:980px;margin:22px auto 10px;font-size:19px;font-weight:500;color:var(--glow)}
  .grid{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
  .card{position:relative;background:rgba(255,255,255,.05);border:2px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .note{margin:0 10px 10px;min-height:44px;resize:vertical;background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:15px}
  video{cursor:pointer}
  .card.sel{border-color:var(--glow);box-shadow:0 0 0 2px rgba(245,166,35,.25)}
  .media{background:#000;aspect-ratio:9/16;width:100%;display:block}
  .media.post{aspect-ratio:4/5}
  .media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
  .meta{padding:9px 10px 11px;display:flex;flex-direction:column;gap:4px}
  .nm{font-size:15px;font-weight:500;line-height:1.3}
  .tp{font-size:12.5px;color:var(--dim)}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-inline-start:6px;font-size:11.5px}
  label.pick{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);cursor:pointer;font-size:15px;min-height:48px}
  label.pick input{width:24px;height:24px;accent-color:#F5A623;flex:none}
  .num{position:absolute;top:8px;inset-inline-start:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:1px 8px;font-size:13px}
  .dock{position:fixed;inset-inline:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);background:rgba(7,11,26,.94);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:center;z-index:5}
  .send{background:var(--glow);color:#1b1305;border:0;border-radius:14px;font:inherit;font-size:18px;font-weight:600;padding:13px 28px;cursor:pointer}
  .send[disabled]{opacity:.45}
  #cnt{font-size:16px}
  #said{max-width:980px;margin:14px auto 0;text-align:center;font-size:15.5px;min-height:24px}
  #manual{display:none;max-width:560px;margin:10px auto;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.06);font-size:14px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h1>סגנונות חדשים לחשבון הנרות</h1>
  <p class="lede">מסמנים את מה שאוהבים, כותבים הערה מתחת לכל דוגמה, ולוחצים על שליחה אחת. נגיעה בסרטון משמיעה את הקול.</p>
  <p class="lede"><a href="../" style="color:inherit">חזרה למוניטור</a></p>
  <div class="bar" id="bar"></div>
</header>
<div id="gal"></div>
<div id="said" role="status"></div>
<div id="manual"></div>
<div class="dock">
  <span id="cnt">0 נבחרו</span>
  <button class="send" id="send" type="button" disabled>שלח בחירה</button>
</div>
<script>
var G = [
 ["צילום אמיתי עם קול, אנשים חדשים בכל סרטון",[
  ["s31","ירושלים, מתנה ממני על כל התמיכה","סטורי","עב","mp4"],
  ["s32","ברוקלין, מתנה לכל יהודי בעולם","סטורי","EN","mp4"],
  ["s33","פריז, לפי המיקום ב 15 שפות","סטורי","עב","mp4"],
  ["s34","לונדון, נר נשמה חדש","סטורי","EN","mp4"],
  ["s35","בואנוס איירס, רבנו תם ואשכנז וספרד","סטורי","עב","mp4"],
  ["s36","מלבורן, מתנה ו 15 שפות","סטורי","EN","mp4"],
  ["s37","רומא, נר נשמה חדש","סטורי","עב","mp4"],
  ["s38","טורונטו, אשכנז, ספרד ורבנו תם","סטורי","EN","mp4"]]],
 ["צילום אמיתי על כל המסך",[
  ["s11","תמונה אמיתית, בחינם מתנה ממני","פוסט","עב","jpg"]]],
 ["גרפיקה ומלל",[
  ["s12","שעון מתקתק עד ההדלקה","סטורי","עב","mp4"],
  ["s13","מפת העולם עם נקודות אור","סטורי","עב","mp4"],
  ["s14","15 שפות מתחלפות","סטורי","עב","mp4"],
  ["s15","רבנו תם מול זמן רגיל","סטורי","עב","jpg"],
  ["s16","אשכנז מול ספרד","פוסט","עב","jpg"],
  ["s17","כרטיס ציטוט","פוסט","EN","jpg"],
  ["s18","שאלה ותשובה","סטורי","עב","jpg"],
  ["s19","טריוויה על נרות","פוסט","EN","jpg"],
  ["s20","ברכת ההדלקה","סטורי","עב","jpg"],
  ["s21","הבדלה, מתי זה אצלי","סטורי","עב","jpg"]]],
 ["נר נשמה, חדש באתר",[
  ["s22","כרטיס זיכרון לנר נשמה","פוסט","עב","jpg"],
  ["s23","לא לשכוח את התאריך העברי","סטורי","עב","jpg"],
  ["s24","יזכור","סטורי","EN","jpg"]]],
 ["פורמטים של פוסט",[
  ["s25","קרוסלה, מדריך בארבעה צעדים","פוסט","עב","mp4"],
  ["s26","תמונה אחת עם כותרת","פוסט","עב","jpg"],
  ["s27","ריל קצר עם מילים קופצות","פוסט","עב","mp4"],
  ["s28","מתנה ממני, באנגלית","פוסט","EN","jpg"],
  ["s29","לכל יהודי בעולם","פוסט","עב","jpg"]]]
];
var ALL = [];
G.forEach(function(g){ g[1].forEach(function(c){ ALL.push(c); }); });
var chosen = {}, filter = 'הכל', KEY = 'nerStylePick';
try { var s = JSON.parse(localStorage.getItem(KEY) || '{}'); if (s && typeof s === 'object') chosen = s; } catch (e) {}
var notes = {}, NKEY = 'nerStyleNotes';
try { var sn = JSON.parse(localStorage.getItem(NKEY) || '{}'); if (sn && typeof sn === 'object') notes = sn; } catch (e) {}
function saveNotes(){ try { localStorage.setItem(NKEY, JSON.stringify(notes)); } catch (e) {} }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(chosen)); } catch (e) {} }
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function build(){
  var h = '';
  G.forEach(function(g){
    var cards = g[1].filter(function(c){ return filter === 'הכל' || c[2] === filter; });
    if (!cards.length) return;
    h += '<h2>' + esc(g[0]) + '</h2><div class="grid">';
    cards.forEach(function(c){
      var id = c[0], post = c[2] === 'פוסט', src = 'styles/' + id + '.' + c[4];
      var m = c[4] === 'mp4'
        ? '<video src="' + src + '" muted loop playsinline preload="metadata"></video>'
        : '<img src="' + src + '" alt="' + esc(c[1]) + '" loading="lazy">';
      h += '<div class="card' + (chosen[id] ? ' sel' : '') + '" data-id="' + id + '">'
        + '<span class="num">' + id.slice(1) + '</span>'
        + '<div class="media' + (post ? ' post' : '') + '">' + m + '</div>'
        + '<div class="meta"><div class="nm">' + esc(c[1]) + '</div>'
        + '<div class="tp">' + esc(c[2]) + '<span class="tag">' + esc(c[3]) + '</span></div></div>'
        + '<label class="pick"><input type="checkbox" data-id="' + id + '"' + (chosen[id] ? ' checked' : '') + '> אהבתי</label>'
        + '<textarea class="note" data-note="' + id + '" placeholder="הערה">' + esc(notes[id] || '') + '</textarea></div>';
    });
    h += '</div>';
  });
  document.getElementById('gal').innerHTML = h;
  watch(); count();
}
function count(){
  var n = Object.keys(chosen).length;
  document.getElementById('cnt').textContent = n + ' נבחרו';
  document.getElementById('send').disabled = !n && !Object.keys(notes).length;
}
document.getElementById('gal').addEventListener('input', function(e){
  var el = e.target; if (!el.dataset || !el.dataset.note) return;
  var v = el.value.trim(); if (v) notes[el.dataset.note] = v; else delete notes[el.dataset.note];
  saveNotes(); count();
});
document.getElementById('gal').addEventListener('click', function(e){
  var v = e.target; if (v.tagName !== 'VIDEO') return;
  document.querySelectorAll('video').forEach(function(x){ if (x !== v) x.muted = true; });
  v.muted = !v.muted; if (!v.muted) { v.currentTime = 0; var p = v.play(); if (p && p.catch) p.catch(function(){}); }
});
document.getElementById('gal').addEventListener('change', function(e){
  var el = e.target; if (!el.dataset || !el.dataset.id) return;
  if (el.checked) chosen[el.dataset.id] = 1; else delete chosen[el.dataset.id];
  el.closest('.card').classList.toggle('sel', el.checked);
  save(); count();
});
var io = null;
function watch(){
  if (io) io.disconnect();
  if (!('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(function(es){
    es.forEach(function(en){ var v = en.target; if (en.isIntersecting) { var p = v.play(); if (p && p.catch) p.catch(function(){}); } else v.pause(); });
  }, { threshold: 0.4 });
  document.querySelectorAll('video').forEach(function(v){ io.observe(v); });
}
var bar = document.getElementById('bar');
['הכל', 'פוסט', 'סטורי'].forEach(function(f){
  var b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (f === filter ? ' on' : ''); b.textContent = f;
  b.onclick = function(){ filter = f; Array.prototype.forEach.call(bar.children, function(x){ x.classList.toggle('on', x === b); }); build(); };
  bar.appendChild(b);
});

/* Sending: same two channels the monitor itself uses (ntfy first, FormSubmit as backup).
   The topic and the owner code come from the monitor's own encrypted head.json, opened
   with the gate key this browser already holds from the monitor page. */
function gbytes(b64){ var x = atob(b64), a = new Uint8Array(x.length); for (var i = 0; i < x.length; i++) a[i] = x.charCodeAt(i); return a; }
function keys(){
  var saved = ''; try { saved = localStorage.getItem('gateKey') || ''; } catch (e) {}
  if (!saved) return Promise.reject(new Error('nokey'));
  return crypto.subtle.importKey('raw', gbytes(saved), { name: 'AES-GCM' }, false, ['decrypt'])
    .then(function(k){
      return fetch('../data/head.json?b=' + Date.now(), { cache: 'no-store' }).then(function(r){ if (!r.ok) throw new Error('head'); return r.text(); })
        .then(function(t){ var p = t.split('.'); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: gbytes(p[0]) }, k, gbytes(p[1])); });
    })
    .then(function(buf){ var d = JSON.parse(new TextDecoder().decode(buf)); return d.keys || {}; });
}
function sendNow(K, text){
  var code = K.ownerCode || (function(){ try { return localStorage.getItem('monitorCode') || ''; } catch (e) { return ''; } })();
  var body = ['בחירת סגנונות נרות', text, '', 'קוד ' + code].join(String.fromCharCode(10));
  return fetch('https://ntfy.sh/' + K.ntfyIn, { method: 'POST', headers: { Title: 'monitor', 'X-Tags': 'memo' }, body: body })
    .then(function(r){ if (!r.ok) throw new Error('ntfy'); return 'ok'; })
    .catch(function(){
      return fetch('https://formsubmit.co/ajax/' + K.mail, { method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ _subject: 'בחירת סגנונות נרות', _template: 'table', 'הודעה': text, 'קוד': code }) })
        .then(function(r){ if (!r.ok) throw new Error('quota'); return 'backup'; });
    });
}
function summary(){
  var nl = String.fromCharCode(10);
  var ids = ALL.filter(function(c){ return chosen[c[0]]; });
  return 'נבחרו ' + ids.length + ' סגנונות. המזהים: ' + ids.map(function(c){ return c[0]; }).join(', ') + nl
    + ids.map(function(c){ return c[0] + ' ' + c[1] + ' (' + c[2] + ')'; }).join(nl)
    + (Object.keys(notes).length ? nl + nl + 'הערות:' + nl + ALL.filter(function(c){ return notes[c[0]]; }).map(function(c){ return c[0] + ' ' + c[1] + ': ' + notes[c[0]]; }).join(nl) : '');
}
document.getElementById('send').onclick = function(){
  var said = document.getElementById('said'), man = document.getElementById('manual'), btn = this;
  var text = summary();
  btn.disabled = true; said.textContent = 'שולח.'; man.style.display = 'none';
  keys().then(function(K){ return sendNow(K, text); })
    .then(function(){ said.textContent = 'נשלח. הבחירה הגיעה למוניטור.'; count(); })
    .catch(function(e){
      man.style.display = 'block'; man.textContent = text;
      try { navigator.clipboard.writeText(text); } catch (x) {}
      said.textContent = 'לא הצלחתי לשלוח מכאן. הבחירה הועתקה, ומדביקים אותה בצ׳אט של המוניטור. כדי ששליחה תעבוד מכאן, פותחים פעם אחת את המוניטור באותו דפדפן.';
      count();
    });
};
build();
</script>
</body>
</html>
