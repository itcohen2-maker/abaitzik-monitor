<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>candle.times</title>
<meta name="theme-color" content="#0F1A3A">
<style>
  :root{--ink:#F2F5FA;--dim:rgba(242,245,250,.66);--line:rgba(255,255,255,.14);--glow:#F5A623;--ok:#3ccf8e}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:linear-gradient(180deg,#0F1A3A 0%,#0B1330 58%,#070B1A 100%);background-attachment:fixed;color:var(--ink);
    font-family:Heebo,"Segoe UI",system-ui,sans-serif;font-weight:300;line-height:1.55;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
  header,main{max-width:980px;margin:0 auto}
  header{padding:calc(env(safe-area-inset-top,0px) + 22px) 0 4px;text-align:center}
  h1{font-size:26px;font-weight:500;margin:0 0 4px;direction:ltr}
  .lede{color:var(--dim);font-size:15px;margin:0 0 6px}
  a{color:var(--glow)}
  .next{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 6px}
  h2{margin:22px 0 10px;font-size:19px;font-weight:500;color:var(--glow)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
  .card{background:rgba(255,255,255,.05);border:2px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .card.hero{border-color:var(--glow)}
  .media{background:#000;aspect-ratio:9/16;width:100%}
  .media video{width:100%;height:100%;object-fit:cover;display:block}
  .meta{padding:9px 10px;display:flex;flex-direction:column;gap:3px}
  .k{font-size:13px;color:var(--glow);font-weight:500}
  .nm{font-size:15px;font-weight:500}
  .tp{font-size:13px;color:var(--dim)}
  .st{display:inline-block;border-radius:6px;padding:0 7px;font-size:12px;border:1px solid var(--line)}
  .st.ok{color:var(--ok);border-color:var(--ok)}
  .st.wait{color:var(--glow);border-color:var(--glow)}
  details{padding:0 10px 10px}
  summary{cursor:pointer;font-size:13px;color:var(--dim)}
  .cap{white-space:pre-wrap;font-size:13.5px;color:var(--dim);margin:6px 0 0;direction:auto}
  .ok-box{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;cursor:pointer;padding:4px 0}
  .ok-box input{width:22px;height:22px;accent-color:var(--ok)}
  .week{display:flex;justify-content:center;margin:10px 0 0}
  .week button{font:inherit;font-size:16px;font-weight:500;background:var(--ok);color:#06210f;border:0;border-radius:12px;padding:10px 18px;cursor:pointer}
  .nw{border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:14px 0 0;background:rgba(255,255,255,.05)}
  .nw.low{border-color:var(--glow);animation:nwb 1.2s ease-in-out infinite}
  @keyframes nwb{50%{box-shadow:0 0 0 6px rgba(245,166,35,.35)}}
  .nw small{display:block;color:var(--dim);font-size:13px;margin-top:4px}
  .chg summary{font-size:13px;color:var(--glow)}
  .chg textarea{width:100%;margin:6px 0;font:inherit;font-size:15px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);padding:8px}
  .chg button{font:inherit;font-size:14px;background:var(--glow);color:#1a1000;border:0;border-radius:10px;padding:6px 14px;cursor:pointer}
  .empty{border:1px dashed var(--line);border-radius:14px;padding:14px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>🕯️ candle.times</h1>
  <p class="lede">רק מה שעוד לא עלה, לפי הסדר. מה שעלה נמחק. ראשון עד חמישי 20:00, שישי 09:00, בשבת וחגים כלום.</p>
  <p class="lede"><a href="../">חזרה למוניטור</a></p>
</header>
<main id="m"><p class="empty">טוען…</p></main>
<script>
(function(){
 function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
 var DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
 function when(it){var d=new Date(it.date+'T12:00:00');return 'יום '+DAYS[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+', '+it.time;}
 function st(it){
  if(it.posted)return '<span class="st ok">עלה</span>';
  if(it.failed)return '<span class="st">נכשל</span>';
  if(it.hold)return '<span class="st">נעצר</span>';
  return it.approved?'<span class="st ok">מאושר, יעלה לבד</span>':'<span class="st wait">מחכה ל"תעלה" שלך</span>';
 }
 function card(it,label,hero){
  var kind=it.kind==='story'?'סטורי':'פוסט',lang=it.lang==='en'?'באנגלית':'בעברית';
  return '<div class="card'+(hero?' hero':'')+'"><div class="media"><video src="'+esc(it.file)+'" controls playsinline preload="metadata"></video></div>'
   +'<div class="meta">'+(label?'<span class="k">'+label+'</span>':'')
   +'<span class="nm">'+kind+' '+lang+(it.city?', '+esc(it.city):'')+'</span>'
   +'<span class="tp">'+when(it)+'</span><span>'+st(it)+'</span>'
   +(it.posted?'':'<label class="ok-box"><input type="checkbox" data-n="'+esc(it.name)+'"'+(it.approved?' checked':'')+'> מאשר</label>')
   +(it.posted?'':'<details class="chg"><summary>רוצה לשנות או להוסיף</summary><textarea rows="3" data-c="'+esc(it.name)+'" placeholder="מה לשנות? מלל, עיר, תמונה, יום, או מה להוסיף"></textarea><button type="button" data-cs="'+esc(it.name)+'">שלח</button></details>')+'</div>'
   +(it.caption?'<details><summary>הכיתוב שיעלה</summary><p class="cap">'+esc(it.caption)+'</p></details>':'')
   +'</div>';
 }
 var SEND=null;try{SEND=JSON.parse(sessionStorage.getItem('nerSend')||'null');}catch(e){}
 function approve(names,on,done){
  if(!SEND||!SEND.t){alert('פתח את הדף מהאריח במוניטור כדי לאשר');done(false);return;}
  fetch('https://ntfy.sh/'+SEND.t+'?filename=ner-approve.json',{method:'PUT',headers:{Title:'ner-approve'},
   body:JSON.stringify({names:names,approved:on,code:SEND.c,at:new Date().toISOString()})})
   .then(function(r){done(r.ok);},function(){done(false);});
 }
 var REQ={};
 fetch('request.json?v='+Date.now()).then(function(r){return r.ok?r.json():{};}).catch(function(){return {};}).then(function(x){REQ=x||{};
  if(REQ.status==='building'&&Date.now()-Date.parse(REQ.at||0)>12*36e5)REQ={};return fetch('queue.json?v='+Date.now());}).then(function(r){return r.json();}).then(function(q){
  q.sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time);});
  var up=q.filter(function(x){return !x.posted;}),done=q.filter(function(x){return x.posted;}).reverse().slice(0,8);
  var np=up.find(function(x){return x.kind!=='story';}),ns=up.find(function(x){return x.kind==='story';});
  var h='<div class="next">'+(np?card(np,'הפוסט הבא',1):'<div class="empty">אין פוסט בתור</div>')+(ns?card(ns,'הסטורי הבא',1):'<div class="empty">אין סטורי בתור</div>')+'</div>';
  var rest=up.filter(function(x){return x!==np&&x!==ns;});
  if(rest.length)h+='<h2>אחר כך</h2><div class="grid">'+rest.map(function(x){return card(x);}).join('')+'</div>';

  var last=q.filter(function(x){return x.approved&&!x.failed;}).map(function(x){return x.date;}).sort().pop()||'';
  var left=last?Math.round((Date.parse(last)-Date.parse(new Date(Date.now()+3*36e5).toISOString().slice(0,10)))/864e5):0;
  var nw='<div class="nw'+(left<=1&&REQ.status!=='building'?' low':'')+'" id="nw">'
   +(REQ.status==='building'?'<b>🛠️ השבוע הבא בבנייה במחשב</b><small>יעלה לתור מאושר, בלי שתצטרך לעשות כלום</small>'
   :'<label class="ok-box"><input type="checkbox" id="nwBox"> תכין לי עוד סטוריז ופוסטים לכל השבוע הבא</label>'
    +'<small>'+(last?'התור מלא עד '+last.slice(8)+'.'+last.slice(5,7)+'. ':'')+'מסמנים, והכל נבנה ועולה לבד, מאושר.</small>')+'</div>';
  var wk=up.filter(function(x){return !x.approved;}).map(function(x){return x.name;});
  if(wk.length)h='<div class="week"><button type="button" id="wk">מאשר את כל השבוע ('+wk.length+')</button></div>'+h;
  h=nw+h;
  document.getElementById('m').innerHTML=h;
  var nb=document.getElementById('nwBox');
  if(nb)nb.addEventListener('change',function(){if(!nb.checked)return;nb.disabled=true;
   if(!SEND||!SEND.t){alert('פתח את הדף מהאריח במוניטור');nb.checked=false;nb.disabled=false;return;}
   fetch('https://ntfy.sh/'+SEND.t+'?filename=ner-week.json',{method:'PUT',headers:{Title:'ner-week'},
    body:JSON.stringify({code:SEND.c,at:new Date().toISOString()})}).then(function(r){
     var d=document.getElementById('nw');
     if(r.ok){d.className='nw';d.innerHTML='<b>🛠️ קיבלתי, השבוע הבא בבנייה</b><small>יעלה לתור מאושר, בלי שתצטרך לעשות כלום</small>';}
     else{nb.checked=false;nb.disabled=false;}
    },function(){nb.checked=false;nb.disabled=false;});});
  function mark(names,on,ok){names.forEach(function(n){var b=document.querySelector('input[data-n="'+n+'"]');if(!b)return;
   if(!ok){b.checked=!on;return;}b.checked=on;var s=b.closest('.meta').querySelector('.st');s.className='st'+(on?' ok':' wait');s.textContent=on?'אושר, נשלח לשרת':'האישור בוטל';});}
  document.querySelectorAll('input[data-n]').forEach(function(b){b.addEventListener('change',function(){
   var on=b.checked;approve([b.getAttribute('data-n')],on,function(ok){mark([b.getAttribute('data-n')],on,ok);});});});
  document.querySelectorAll('button[data-cs]').forEach(function(b){b.addEventListener('click',function(){
   var n=b.getAttribute('data-cs'),ta=document.querySelector('textarea[data-c="'+n+'"]'),t=(ta.value||'').trim();
   if(!t)return;if(!SEND||!SEND.t){alert('פתח את הדף מהאריח במוניטור');return;}
   var it=q.find(function(x){return x.name===n;})||{};b.disabled=true;
   var msg='candle.times, שינוי בפריט '+n+' ('+when(it)+', '+(it.city||'')+'): '+t;
   fetch('https://ntfy.sh/'+SEND.t,{method:'POST',headers:{Title:'monitor','X-Tags':'memo'},body:['משימה',msg,'','קוד '+SEND.c].join(String.fromCharCode(10))})
    .then(function(r){b.textContent=r.ok?'נשלח ✓':'לא נשלח, נסה שוב';b.disabled=r.ok;if(r.ok)ta.disabled=true;},function(){b.textContent='לא נשלח, נסה שוב';b.disabled=false;});});});
  var wb=document.getElementById('wk');
  if(wb)wb.addEventListener('click',function(){wb.disabled=true;approve(wk,true,function(ok){mark(wk,true,ok);wb.textContent=ok?'השבוע אושר ✓':'לא נשלח, נסה שוב';wb.disabled=ok;});});
  document.addEventListener('play',function(e){document.querySelectorAll('video').forEach(function(v){if(v!==e.target)v.pause();});},true);
 }).catch(function(){document.getElementById('m').innerHTML='<p class="empty">לא הצלחתי לטעון את התור</p>';});
})();
</script>
</body>
</html>
