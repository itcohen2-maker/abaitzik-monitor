<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>candle.times</title>
<meta name="theme-color" content="#0C1430">
<meta name="color-scheme" content="dark">
<!--
  31.10, Itzik: "תעצב דף אחר. הקיים לא נח בכלל". One list by day, a big video
  per item, two plain buttons: מאשר / לא מאשר. Nothing goes up without his
  מאשר; לא מאשר puts the item on hold on the server, so it never posts.
  The approval travels as before (ntfy, Title ner-approve, listen.js
  recordNerApprove), with "rejected" added for לא מאשר and its undo.
-->
<style>
  @font-face{font-family:'Heebo';font-weight:200 600;font-display:swap;src:url(fonts/heebo-v28-hebrew.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Heebo';font-weight:200 600;font-display:swap;src:url(fonts/heebo-v28-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
  :root{
    --bg:#0C1430;--bg2:#08102A;--card:#121C3E;--card2:#17234A;
    --ink:#F3F1EC;--dim:#B9BFD3;--faint:#8D95B0;--line:rgba(243,241,236,.12);
    --flame:#F2B24C;--flame-ink:#2A1800;
    --ok:#4FD39A;--ok-bg:rgba(79,211,154,.12);--ok-ink:#03261A;
    --no:#F08A7E;--no-bg:rgba(240,138,126,.12);
    --r:16px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(120% 60% at 50% 0%,#16224D 0%,var(--bg) 55%,var(--bg2) 100%) fixed;
    color:var(--ink);font-family:Heebo,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;
    font-size:17px;line-height:1.55;
    padding:0 16px calc(env(safe-area-inset-bottom,0px) + 48px);
    overflow-x:hidden;
  }
  ::selection{background:rgba(242,178,76,.35);color:var(--ink)}
  :focus-visible{outline:3px solid var(--flame);outline-offset:3px;border-radius:10px}
  a{color:var(--flame);text-underline-offset:4px}
  .wrap{max-width:560px;margin:0 auto}
  header{padding:calc(env(safe-area-inset-top,0px) + 18px) 0 6px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:24px;font-weight:500;letter-spacing:-.01em;direction:ltr}
  .back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;font-size:16px;color:var(--dim);text-decoration:none}
  .back svg{width:18px;height:18px}
  .rule{margin:6px 0 0;color:var(--dim);font-size:16px}

  .bar{position:sticky;top:0;z-index:5;margin:14px -16px 0;padding:10px 16px calc(10px);
    background:rgba(12,20,48,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .count{font-size:15px;color:var(--dim)}
  .count b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;
    border-radius:14px;border:1px solid transparent;font-size:17px;font-weight:500;transition:transform .12s ease,background-color .2s ease,opacity .2s ease}
  .btn:active{transform:scale(.98)}
  .btn svg{width:20px;height:20px;flex:none}
  .btn[disabled]{opacity:.55;cursor:default}
  .yes{background:var(--ok);color:var(--ok-ink)}
  .no{background:transparent;color:var(--no);border-color:rgba(240,138,126,.55)}
  .soft{background:var(--card2);color:var(--ink);border-color:var(--line);min-height:44px;font-size:15px;font-weight:400}
  .all{min-height:44px;font-size:15px}

  .day{margin:30px 0 0}
  .dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
  h2{margin:0;font-size:21px;font-weight:500;letter-spacing:-.01em}
  h2 small{display:block;font-size:14px;font-weight:300;color:var(--faint);margin-top:2px}

  .item{background:var(--card);border-radius:var(--r);overflow:hidden;margin:0 0 16px;
    box-shadow:0 10px 30px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.2)}
  .item.ok{box-shadow:0 0 0 2px var(--ok),0 10px 30px rgba(0,0,0,.28)}
  .item.rej{opacity:.72}
  .vid{position:relative;background:#000;aspect-ratio:9/16;max-height:62vh;margin:0 auto;width:100%}
  .vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0}
  .play span{width:76px;height:76px;border-radius:50%;background:rgba(8,16,42,.62);display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .play svg{width:32px;height:32px;margin-inline-start:4px;fill:var(--ink)}
  .body{padding:14px 16px 16px}
  .tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tag{font-size:14px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--card2);color:var(--ink)}
  .tag.k{background:rgba(242,178,76,.16);color:var(--flame)}
  .when{font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums;margin-inline-start:auto}
  .cap{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.22);color:var(--ink);font-size:16px;line-height:1.6;
    white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;direction:auto;max-height:11.5em;overflow:auto}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}
  .acts .btn{white-space:nowrap;padding:0 12px}
  .state{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 0;padding:12px 14px;border-radius:12px;font-size:16px;font-weight:500}
  .state.ok{background:var(--ok-bg);color:var(--ok)}
  .state.rej{background:var(--no-bg);color:var(--no)}
  .state.wait{background:rgba(242,178,76,.12);color:var(--flame)}
  .state svg{width:20px;height:20px;flex:none}
  .state span{display:flex;align-items:center;gap:8px}
  .undo{background:none;border:0;color:var(--dim);font-size:15px;text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 4px}
  details.chg{margin:12px 0 0}
  details.chg summary{list-style:none;color:var(--dim);font-size:15px;min-height:44px;display:flex;align-items:center;cursor:pointer}
  details.chg summary::-webkit-details-marker{display:none}
  details.chg textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 8px;resize:vertical}
  details.chg textarea::placeholder{color:var(--faint)}

  .empty{margin:36px 0 0;padding:28px 22px;border-radius:var(--r);background:var(--card);text-align:center}
  .empty .flame{width:44px;height:44px;margin:0 auto 10px;display:block}
  .empty h2{font-size:20px}
  .empty p{margin:8px auto 0;color:var(--dim);max-width:34ch}
  .note{color:var(--faint);font-size:14px;text-align:center;margin:26px 0 0}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,20px);opacity:0;
    background:#F3F1EC;color:#0C1430;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4);
    transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;max-width:calc(100% - 32px);z-index:20;pointer-events:none}
  .toast.on{transform:translate(-50%,0);opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15.5V6.5A2.5 2.5 0 0 1 7.5 4H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l11.8-7.2a1 1 0 0 0 0-1.72L8.5 3.94A1 1 0 0 0 7 4.8z"/></symbol>
</svg>
<header class="wrap">
  <div class="top">
    <h1>candle.times</h1>
    <a class="back" href="../"><svg><use href="#i-back"/></svg>למוניטור</a>
  </div>
  <p class="rule">כלום לא עולה לאינסטגרם בלי שתלחץ מאשר.</p>
</header>
<div class="bar" id="bar" hidden><div class="wrap"><span class="count" id="count"></span><span id="allSlot"></span></div></div>
<main class="wrap" id="m" aria-live="polite"><p class="note">טוען</p></main>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
 var M=document.getElementById('m');
 function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
 function ic(n){return '<svg aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
 var DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
 function dayName(d){var x=new Date(d+'T12:00:00');return 'יום '+DAYS[x.getDay()];}
 function dayNum(d){var x=new Date(d+'T12:00:00');return x.getDate()+'.'+(x.getMonth()+1);}
 function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove('on');},2600);}

 var SEND=null;try{SEND=JSON.parse(sessionStorage.getItem('nerSend')||'null');}catch(e){}
 // What he tapped, kept until the server's copy agrees (the mirror takes a minute or two).
 var PEND={};try{PEND=JSON.parse(localStorage.getItem('nerPend')||'{}')||{};}catch(e){PEND={};}
 function savePend(){try{localStorage.setItem('nerPend',JSON.stringify(PEND));}catch(e){}}

 function serverState(it){if(it.rejected||it.hold)return 'rej';return it.approved?'ok':'wait';}
 function state(it){
  var p=PEND[it.name],s=serverState(it);
  if(p&&p.s!==s&&Date.now()-p.at<20*60e3)return p.s;
  if(p){delete PEND[it.name];savePend();}
  return s;
 }

 function send(names,payload,done){
  if(!SEND||!SEND.t){toast('צריך לפתוח את הדף מהאריח במוניטור');done(null);return;}
  var body={names:names,code:SEND.c,at:new Date().toISOString()};
  for(var k in payload)body[k]=payload[k];
  fetch('https://ntfy.sh/'+SEND.t+'?filename=ner-approve.json',{method:'PUT',headers:{Title:'ner-approve'},body:JSON.stringify(body)})
   .then(function(r){done(r.ok);},function(){done(false);});
 }
 var ACT={ok:{approved:true,rejected:false},rej:{approved:false,rejected:true},wait:{approved:false,rejected:false}};
 function setState(names,s){
  send(names,ACT[s],function(ok){
   if(ok===null){render();return;}
   if(!ok){toast('לא נשלח. בדוק חיבור ונסה שוב');render();return;}
   names.forEach(function(n){PEND[n]={s:s,at:Date.now()};});savePend();render();
   toast(s==='ok'?(names.length>1?'אושרו '+names.length+' פריטים':'אושר. יעלה בזמן שלו'):s==='rej'?'סומן לא מאשר. לא יעלה':'בוטל. מחכה להחלטה שלך');
  });
 }

 var Q=[];
 function item(it){
  var s=state(it),story=it.kind==='story',abroad=it.lang==='en';
  var h='<article class="item'+(s==='ok'?' ok':s==='rej'?' rej':'')+'" data-n="'+esc(it.name)+'">'
   +'<div class="vid"><video src="'+esc(it.file)+'#t=0.6" playsinline preload="metadata"></video>'
   +'<button type="button" class="play" data-play aria-label="נגן את הסרטון"><span>'+ic('play')+'</span></button></div>'
   +'<div class="body"><div class="tags"><span class="tag k">'+(story?'סטורי':'פוסט')+'</span><span class="tag">'+(abroad?'חו״ל':'ישראל')+'</span>'
   +(it.city?'<span class="tag">'+esc(it.city)+'</span>':'')+'<span class="when">'+esc(it.time||'')+'</span></div>';
  if(it.caption)h+='<p class="cap">'+esc(it.caption)+'</p>';
  h+='<div class="tools">'+(it.caption?'<button type="button" class="btn soft" data-copy>'+ic('copy')+'העתקת הכיתוב</button>':'')
   +'<button type="button" class="btn soft" data-dl>'+ic('down')+'שמירה בטלפון</button></div>';
  if(s==='ok')h+='<div class="state ok"><span>'+ic('check')+'מאושר. יעלה ב '+esc(it.time||'')+'</span><button type="button" class="undo" data-set="wait">ביטול</button></div>';
  else if(s==='rej')h+='<div class="state rej"><span>'+ic('x')+'לא מאושר. לא יעלה</span><button type="button" class="undo" data-set="wait">ביטול</button></div>';
  else h+='<div class="acts"><button type="button" class="btn yes" data-set="ok">'+ic('check')+'מאשר</button><button type="button" class="btn no" data-set="rej">'+ic('x')+'לא מאשר</button></div>';
  h+='<details class="chg"><summary>רוצה לשנות משהו בפריט הזה</summary><textarea rows="3" placeholder="מה לשנות: מלל, תמונה, יום, שעה"></textarea><button type="button" class="btn soft" data-chg>שליחה</button></details>';
  return h+'</div></article>';
 }

 function render(){
  var up=Q.filter(function(x){return !x.posted&&!x.failed;});
  up.sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time);});
  var bar=document.getElementById('bar');
  if(!up.length){
   bar.hidden=true;
   M.innerHTML='<section class="empty"><svg class="flame" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6c5 7 10 12 10 20a10 10 0 0 1-20 0c0-5 3-8 5-12 1 3 2 5 4 6 0-5 0-9 1-14z" fill="#F2B24C"/><rect x="20" y="36" width="8" height="8" rx="2" fill="#F3F1EC"/></svg>'
    +'<h2>אין כרגע מה לאשר</h2><p>דוגמאות חדשות בהכנה: משפט חכם על רקע נרות, בעברית ובאנגלית. כשהן יהיו מוכנות הן יופיעו כאן לאישור שלך.</p></section>';
   return;
  }
  var waiting=up.filter(function(x){return state(x)==='wait';});
  var ok=up.filter(function(x){return state(x)==='ok';}).length;
  bar.hidden=false;
  document.getElementById('count').innerHTML='<b>'+waiting.length+'</b> מחכים לך · <b>'+ok+'</b> מאושרים';
  document.getElementById('allSlot').innerHTML=waiting.length>1?'<button type="button" class="btn yes all" data-all>'+ic('check')+'מאשר הכל ('+waiting.length+')</button>':'';
  var days={},order=[];
  up.forEach(function(x){if(!days[x.date]){days[x.date]=[];order.push(x.date);}days[x.date].push(x);});
  M.innerHTML=order.map(function(d){
   var w=days[d].filter(function(x){return state(x)==='wait';}).length;
   return '<section class="day" data-day="'+esc(d)+'"><div class="dayhead"><h2>'+dayName(d)+'<small>'+dayNum(d)+'</small></h2>'
    +(w>1?'<button type="button" class="btn soft" data-dayok>'+ic('check')+'מאשר את כל היום</button>':'')+'</div>'
    +days[d].map(item).join('')+'</section>';
  }).join('')+'<p class="note">פריט שעלה יורד מהרשימה.</p>';
 }

 document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  var art=t.closest('.item'),it=art?Q.find(function(x){return x.name===art.getAttribute('data-n');}):null;
  if(t.hasAttribute('data-play')){var v=art.querySelector('video');v.controls=true;t.remove();v.play().catch(function(){});return;}
  if(t.hasAttribute('data-set')){t.disabled=true;setState([it.name],t.getAttribute('data-set'));return;}
  if(t.hasAttribute('data-all')){t.disabled=true;setState(Q.filter(function(x){return !x.posted&&state(x)==='wait';}).map(function(x){return x.name;}),'ok');return;}
  if(t.hasAttribute('data-dayok')){var d=t.closest('.day').getAttribute('data-day');t.disabled=true;
   setState(Q.filter(function(x){return x.date===d&&!x.posted&&state(x)==='wait';}).map(function(x){return x.name;}),'ok');return;}
  if(t.hasAttribute('data-copy')){var c=it.caption||'';
   (navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(function(){toast('הכיתוב הועתק');},function(){
    var r=document.createRange();r.selectNodeContents(art.querySelector('.cap'));var s=getSelection();s.removeAllRanges();s.addRange(r);toast('הכיתוב מסומן, אפשר להעתיק');});return;}
  if(t.hasAttribute('data-dl')){
   // iPhone: the share sheet has "Save Video", which puts it in Photos.
   var src=it.file,nm=it.name+'.mp4';
   function plain(){var a=document.createElement('a');a.href=src;a.download=nm;document.body.appendChild(a);a.click();a.remove();}
   if(t._file){navigator.share({files:[t._file]}).catch(function(){});return;}
   if(!(navigator.canShare&&window.File)){plain();return;}
   t.disabled=true;toast('מכין את הסרטון');
   fetch(src).then(function(r){return r.blob();}).then(function(bl){t.disabled=false;var f=new File([bl],nm,{type:'video/mp4'});
    if(!navigator.canShare({files:[f]})){plain();return;}t._file=f;toast('לחץ שוב לשמירה בתמונות');},function(){t.disabled=false;plain();});return;}
  if(t.hasAttribute('data-chg')){var ta=art.querySelector('textarea'),txt=(ta.value||'').trim();if(!txt){ta.focus();return;}
   if(!SEND||!SEND.t){toast('צריך לפתוח את הדף מהאריח במוניטור');return;}t.disabled=true;
   var msg='candle.times, שינוי בפריט '+it.name+' ('+dayName(it.date)+' '+dayNum(it.date)+' '+(it.time||'')+(it.city?', '+it.city:'')+'): '+txt;
   fetch('https://ntfy.sh/'+SEND.t,{method:'POST',headers:{Title:'monitor','X-Tags':'memo'},body:['משימה',msg,'','קוד '+SEND.c].join(String.fromCharCode(10))})
    .then(function(r){if(r.ok){ta.disabled=true;t.textContent='נשלח';toast('הבקשה נשלחה');}else{t.disabled=false;toast('לא נשלח, נסה שוב');}},function(){t.disabled=false;toast('לא נשלח, נסה שוב');});return;}
 });
 document.addEventListener('play',function(e){document.querySelectorAll('video').forEach(function(v){if(v!==e.target)v.pause();});},true);

 fetch('queue.json?v='+Date.now()).then(function(r){return r.ok?r.json():[];}).then(function(q){Q=Array.isArray(q)?q:[];render();})
  .catch(function(){M.innerHTML='<section class="empty"><h2>לא הצלחתי לטעון את הרשימה</h2><p>בדוק חיבור ורענן את הדף.</p></section>';});
})();
</script>
</body>
</html>
