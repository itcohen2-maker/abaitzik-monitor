<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>סדר יהי רצון לראש השנה, להדפסה</title>
<style>
 :root{color-scheme:light}
 body{margin:0;background:#f4f1ea;font:400 16px/1.5 Heebo,system-ui,sans-serif;color:#20242c}
 .bar{position:sticky;top:0;display:flex;gap:10px;align-items:center;justify-content:center;
  padding:12px 16px;background:#fff;border-bottom:1px solid #e2ddd2}
 .bar b{flex:1;font:800 16px Heebo,sans-serif}
 .bar button,.bar a{border:0;border-radius:999px;padding:11px 20px;font:800 15px Heebo,sans-serif;
  cursor:pointer;text-decoration:none;display:inline-block}
 .bar button{background:#1a73e8;color:#fff}
 .bar a{background:#eceff4;color:#20242c}
 .sheet{max-width:820px;margin:18px auto;padding:0 12px}
 .sheet img{width:100%;height:auto;display:block;box-shadow:0 10px 30px rgba(20,30,60,.18);border-radius:6px}
 .tip{max-width:820px;margin:0 auto 30px;padding:0 14px;font-size:14px;color:#5a6172}
 @media print{
  @page{size:A4 portrait;margin:6mm}
  .bar,.tip{display:none}
  body{background:#fff}
  .sheet{max-width:none;margin:0;padding:0}
  .sheet img{box-shadow:none;border-radius:0;width:100%;height:auto}
 }
</style>
</head>
<body>
<div class="bar">
 <b>סדר יהי רצון לראש השנה</b>
 <a href="files/rosh-hashana-simanim.jpg" target="_blank" rel="noopener">פתיחת הקובץ</a>
 <button type="button" onclick="window.print()">הדפסה</button>
</div>
<div class="sheet"><img src="files/rosh-hashana-simanim.jpg" alt="סדר יהי רצון המלא לראש השנה"></div>
<p class="tip">לוחצים הדפסה, בוחרים A4 לאורך, ומוודאים שהשוליים על ברירת המחדל. אם יוצא חתוך, בוחרים התאמה לדף.</p>
</body>
</html>
