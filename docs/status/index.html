<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>סטטוס וואטסאפ</title>
<meta name="theme-color" content="#0C1430">
<meta name="color-scheme" content="dark">
<!--
  1.11, Itzik: a ready video and text for the WhatsApp status each day, he posts it himself
  from the iPhone in three taps. Nothing here touches WhatsApp: the page only copies the text
  and opens the iOS share sheet. The "posted" button is remembered here and sent to the server
  (ntfy Title wa-status-done, listen.js recordWaStatusDone) so the morning push stays quiet.
  Same look family as ../ner/candle.html.
-->
<style>
  @font-face{font-family:'Heebo';font-weight:200 600;font-display:swap;src:url(../ner/fonts/heebo-v28-hebrew.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Heebo';font-weight:200 600;font-display:swap;src:url(../ner/fonts/heebo-v28-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
  :root{--bg:#0C1430;--bg2:#08102A;--card:#121C3E;--card2:#17234A;--ink:#F3F1EC;--dim:#B9BFD3;--faint:#8D95B0;--line:rgba(243,241,236,.12);
    --acc:#F2B24C;--ok:#4FD39A;--ok-bg:rgba(79,211,154,.12);--r:16px}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{background:radial-gradient(120% 60% at 50% 0%,#16224D 0%,var(--bg) 55%,var(--bg2) 100%) fixed;color:var(--ink);
    font-family:Heebo,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;font-size:17px;line-height:1.55;
    padding:0 16px calc(env(safe-area-inset-bottom,0px) + 48px);overflow-x:hidden}
  :focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:10px}
  a{color:var(--acc);text-underline-offset:4px}
  .wrap{max-width:560px;margin:0 auto}
  header{padding:calc(env(safe-area-inset-top,0px) + 18px) 0 6px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:24px;font-weight:500}
  .back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;font-size:16px;color:var(--dim);text-decoration:none}
  .back svg{width:18px;height:18px}
  .rule{margin:6px 0 0;color:var(--dim);font-size:16px}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border-radius:14px;border:1px solid transparent;
    font-size:18px;font-weight:500;text-decoration:none;transition:transform .12s ease,opacity .2s ease}
  .btn:active{transform:scale(.98)}
  .btn svg{width:22px;height:22px;flex:none}
  .dl{display:block;text-align:center;color:#B9BFD3;font-size:15px;margin:10px 0 2px;text-decoration:underline}
  .item:not(.loaded) .share{opacity:.55}
  .share{background:var(--acc);color:#2A1800;width:100%}
  .done{background:transparent;color:var(--ok);border-color:rgba(79,211,154,.6);width:100%}
  .soft{background:var(--card2);color:var(--ink);border-color:var(--line);min-height:44px;font-size:15px;font-weight:400}
  .day{margin:28px 0 0}
  h2{margin:0 0 12px;font-size:21px;font-weight:500}
  h2 small{display:block;font-size:14px;font-weight:300;color:var(--faint);margin-top:2px}
  .item{background:var(--card);border-radius:var(--r);overflow:hidden;margin:0 0 16px;box-shadow:0 10px 30px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.2)}
  .item.posted{box-shadow:0 0 0 2px var(--ok),0 10px 30px rgba(0,0,0,.28)}
  .item.small .vid{max-height:46vh}
  .vid{position:relative;background:#000;aspect-ratio:9/16;max-height:62vh;margin:0 auto;width:100%}
  .vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0}
  .play span{width:76px;height:76px;border-radius:50%;background:rgba(8,16,42,.62);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .play svg{width:32px;height:32px;margin-inline-start:4px;fill:var(--ink)}
  .body{padding:14px 16px 16px}
  .tag{display:inline-block;font-size:14px;font-weight:500;padding:3px 10px;border-radius:999px;background:rgba(242,178,76,.16);color:var(--acc)}
  .cap a{color:#8fd0ff;text-decoration:underline;font-weight:700}
  .cap{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.22);font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;
    -webkit-user-select:text;user-select:text;direction:rtl}
  .stack{display:grid;gap:10px;margin:16px 0 0}
  .hint{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:rgba(242,178,76,.12);color:var(--acc);font-size:16px;font-weight:500}
  .hint[hidden]{display:none}
  .state{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 0;padding:12px 14px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-size:16px;font-weight:500}
  .state span{display:flex;align-items:center;gap:8px}
  .state svg{width:20px;height:20px}
  .undo{background:none;border:0;color:var(--dim);font-size:15px;text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 4px}
  .empty{margin:30px 0 0;padding:24px 20px;border-radius:var(--r);background:var(--card);text-align:center}
  .empty h2{margin:0}
  .empty p{margin:6px 0 0;color:var(--dim)}
  .note{color:var(--faint);font-size:14px;text-align:center;margin:26px 0 0}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,20px);opacity:0;background:#F3F1EC;color:#0C1430;
    border-radius:12px;padding:12px 16px;font-size:15px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .3s,opacity .3s;max-width:calc(100% - 32px);z-index:20;pointer-events:none}
  .toast.on{transform:translate(-50%,0);opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15.5V6.5A2.5 2.5 0 0 1 7.5 4H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4m0 0L8 8m4-4l4 4M6 12v6.5A1.5 1.5 0 0 0 7.5 20h9a1.5 1.5 0 0 0 1.5-1.5V12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l11.8-7.2a1 1 0 0 0 0-1.72L8.5 3.94A1 1 0 0 0 7 4.8z"/></symbol>
</svg>
<header class="wrap">
  <div class="top"><h1>סטטוס וואטסאפ</h1><a class="back" href="../"><svg><use href="#i-back"/></svg>למוניטור</a></div>
  <p class="rule">הסרטון והטקסט של היום מוכנים. שלוש נגיעות ואתה בסטטוס.</p>
</header>
<main class="wrap" id="m" aria-live="polite"><p class="note">טוען</p></main>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
 var M=document.getElementById('m');
 function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
 function ic(n){return '<svg aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
 var DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
 function dayName(d){return 'יום '+DAYS[new Date(d+'T12:00:00').getDay()];}
 function dayNum(d){var x=new Date(d+'T12:00:00');return x.getDate()+'.'+(x.getMonth()+1);}
 function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove('on');},3200);}
 function today(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem'}).format(new Date());}catch(e){return new Date().toISOString().slice(0,10);}}
 var TODAY=(location.search.match(/[?&]today=(\d{4}-\d\d-\d\d)/)||[])[1]||today();

 var SEND=null;try{SEND=JSON.parse(sessionStorage.getItem('nerSend')||'null');}catch(e){}
 var DONE={};try{DONE=JSON.parse(localStorage.getItem('waStatusDone')||'{}')||{};}catch(e){DONE={};}
 function saveDone(){try{localStorage.setItem('waStatusDone',JSON.stringify(DONE));}catch(e){}}
 var Q=[],FILES={};

 function sendDone(name,on){
  if(!SEND||!SEND.t)return;
  fetch('https://ntfy.sh/'+SEND.t+'?filename=wa-status-done.json',{method:'PUT',headers:{Title:'wa-status-done'},
   body:JSON.stringify({name:name,done:on,code:SEND.c,at:new Date().toISOString()})}).catch(function(){});
 }

 function item(it,big){
  var done=!!DONE[it.name];
  var h='<article class="item'+(done?' posted':'')+(big?'':' small')+'" data-n="'+esc(it.name)+'">'
   +'<div class="vid"><video src="'+esc(it.file)+'#t=0.6" playsinline preload="metadata"></video>'
   +'<button type="button" class="play" data-play aria-label="נגן את הסרטון"><span>'+ic('play')+'</span></button></div>'
   +'<div class="body"><span class="tag">'+esc(it.topic||'')+'</span><p class="cap">'+lnk(esc(it.caption))+'</p>';
  if(big){
   h+='<div class="stack"><button type="button" class="btn share" data-share>'+ic('share')+'שתף לסטטוס</button></div><p class="hint" data-hint hidden>הטקסט הועתק. בסטטוס: הדבק בכיתוב</p>';
   h+='<div class="stack"><button type="button" class="btn soft" data-copy>'+ic('copy')+'העתקת הטקסט</button></div>';
   h+='<a class="dl" href="../save.html?f='+encodeURIComponent('status/'+it.file)+'&n='+encodeURIComponent((it.topic||'סטטוס')+' '+it.date)+'">💾 שמירת הסרטון לטלפון</a>';
   h+=done?'<div class="state"><span>'+ic('check')+'סומן שהועלה</span><button type="button" class="undo" data-undo>ביטול</button></div>'
          :'<div class="stack"><button type="button" class="btn done" data-done>'+ic('check')+'העליתי</button></div>';
  }else{
   h+='<div class="stack"><button type="button" class="btn share" data-share>'+ic('share')+'שתף או שמור לטלפון</button></div><p class="hint" data-hint hidden>הטקסט הועתק. בחלון השיתוף: שמור סרטון, או וואטסאפ</p>';
   h+='<div class="stack"><button type="button" class="btn soft" data-copy>'+ic('copy')+'העתקת הטקסט</button></div>';
  }
  return h+'</div></article>';
 }

 /* 6.11, Itzik: links in the text must be tappable */
 function lnk(s){return s.replace(/https?:\/\/[^\s<]+/g,function(m){return '<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>';});}
 function render(){
  var up=Q.filter(function(x){return x.date>=TODAY;}).sort(function(a,b){return a.date.localeCompare(b.date);});
  var days={},order=[];
  up.forEach(function(x){if(!days[x.date]){days[x.date]=[];order.push(x.date);}days[x.date].push(x);});
  var h='';
  if(order.length&&order[0]!==TODAY)h+='<section class="empty"><h2>אין סטטוס להיום</h2><p>הסרטון הבא מופיע למטה.</p></section>';
  h+=order.map(function(d){
   var big=d===TODAY;
   return '<section class="day"><h2>'+(big?'היום':dayName(d))+'<small>'+(big?dayName(d)+', ':'')+dayNum(d)+'</small></h2>'+days[d].map(function(x){return item(x,big);}).join('')+'</section>';
  }).join('');
  M.innerHTML=h||'<section class="empty"><h2>אין סטטוסים מתוכננים</h2><p>כשיהיו מוכנים הם יופיעו כאן.</p></section>';
  preload();
 }

 // The video is fetched as a Blob right at load, so the share tap needs no await (iOS Safari).
 function preload(){
  Q.filter(function(x){return x.date>=TODAY&&!FILES[x.name];}).forEach(function(it){
   FILES[it.name]='loading';
   fetch(it.file).then(function(r){return r.blob();}).then(function(b){FILES[it.name]=new File([b],it.name+'.mp4',{type:'video/mp4'});ready(it.name);},function(){FILES[it.name]=null;ready(it.name);});
  });
 }

 function ready(n){var a=document.querySelector('.item[data-n="'+n+'"]');if(a)a.classList.add('loaded');}
 function copyText(t){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(function(){});return true;}}catch(e){}
  try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();return ok;}catch(e){return false;}
 }
 function plainDownload(it){var a=document.createElement('a');a.href=it.file;a.download=it.name+'.mp4';document.body.appendChild(a);a.click();a.remove();}

 document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  var art=t.closest('.item'),it=art?Q.find(function(x){return x.name===art.getAttribute('data-n');}):null;
  if(t.hasAttribute('data-play')){var v=art.querySelector('video');v.controls=true;t.remove();v.play().catch(function(){});return;}
  if(!it)return;
  if(t.hasAttribute('data-copy')){copyText(it.caption);toast('הטקסט הועתק');return;}
  if(t.hasAttribute('data-share')){
   // All synchronous inside the tap: copy, then share the pre-fetched file.
   copyText(it.caption);
   var hint=art.querySelector('[data-hint]');if(hint)hint.hidden=false;
   var f=FILES[it.name];
   if(f&&f!=='loading'&&navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f]}).catch(function(){});
   }else{
    if(f==='loading'){toast('הסרטון עוד נטען, עוד שנייה ולחץ שוב');return;}
    window.open(it.file,'_blank');toast('הטקסט הועתק. בנגן: שתף, ואז שמור סרטון');
   }
   return;
  }
  if(t.hasAttribute('data-done')){DONE[it.name]=1;saveDone();sendDone(it.name,true);toast('סומן שהועלה');render();return;}
  if(t.hasAttribute('data-undo')){delete DONE[it.name];saveDone();sendDone(it.name,false);render();return;}
 });
 document.addEventListener('play',function(e){document.querySelectorAll('video').forEach(function(v){if(v!==e.target)v.pause();});},true);

 fetch('queue.json?v='+Date.now()).then(function(r){return r.ok?r.json():[];}).then(function(q){Q=Array.isArray(q)?q:[];render();})
  .catch(function(){M.innerHTML='<section class="empty"><h2>לא הצלחתי לטעון את הרשימה</h2><p>בדוק חיבור ורענן את הדף.</p></section>';});
})();
</script>
<script>/* 6.11: opened from a row in the videos tile, jump to that video */(function(){var h=decodeURIComponent(location.hash.slice(1));if(!h)return;var t=0,iv=setInterval(function(){var a=document.querySelector('[data-n="'+h+'"],[data-id="'+h+'"]');if(a||++t>60){clearInterval(iv);if(a){a.scrollIntoView({block:'center'});a.style.outline='3px solid #1d6fe0';a.style.outlineOffset='4px';}}},100);})();</script>
</body>
</html>
